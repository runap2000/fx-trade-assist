
name: Build FX TRADE ASSIST APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: |
          unzip -q FX_TRADE_ASSIST_Android_Project_FIXED.zip -d source

      - name: Build APK
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          cd source/FX_TRADE_ASSIST
          $GITHUB_WORKSPACE/gradle-8.9/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FX-TRADE-ASSIST-APK
          path: source/FX_TRADE_ASSIST/app/build/outputs/apk/debug/app-debug.apk
